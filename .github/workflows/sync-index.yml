name: Sync recordings index

# The dialer uploads one batch a day, so the index is refreshed once a day
# rather than polled. 23:00 UTC is 04:00 Pakistan time — after the upload
# window and before anyone is looking at the dashboard.
#
# Sunday's run does a full reconcile instead of an incremental one: --recent
# only inspects the newest folders, and a late upload can land in an older one.
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run a full reconcile instead of recent-only'
        type: boolean
        default: false

# Two indexers writing at once would fight over the same rows.
concurrency:
  group: sync-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decide scope
        id: scope
        run: |
          # %u is 7 on Sunday. A manual run can force a full pass any day.
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "mode=full reconcile" >> "$GITHUB_OUTPUT"
          else
            echo "args=--recent=2" >> "$GITHUB_OUTPUT"
            echo "mode=incremental (newest 2 folders per group)" >> "$GITHUB_OUTPUT"
          fi

      - name: Index
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
          S3_BUCKET: poshnee-call-recordings
          S3_PREFIX: dialer/
        run: |
          # Without pipefail the pipeline reports tee's exit code, so a crashed
          # indexer would be indistinguishable from a successful sync.
          set -o pipefail
          npx tsx scripts/index-recordings.ts ${{ steps.scope.outputs.args }} | tee run.log

      # Makes the Actions page show what happened without opening the log.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Index sync — ${{ steps.scope.outputs.mode }}"
            echo ""
            if [ -f run.log ]; then
              echo '```'
              tail -n 6 run.log
              echo '```'
            else
              echo "The indexer produced no output — the run failed before it started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
