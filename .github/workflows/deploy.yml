name: Deploy to Vercel

# Why this exists instead of Vercel's own Git integration.
#
# That integration refuses to build: "Git author Muheeeeb must have access to
# the project on Vercel to create deployments." The Vercel team is on the Hobby
# plan, where members cannot be invited, so the author cannot be given access
# without paying for Pro. The author is the only person pushing here, so the
# check protects nothing and only blocks the deploy.
#
# A deploy driven by a token has no such rule: Actions authenticates as the
# token's owner, whoever wrote the commit. `vercel pull` brings down the
# project's own environment variables first, so the build here is the same
# build Vercel would have run.
#
# workflow_dispatch is deliberate: it puts a "Run workflow" button on the
# Actions tab, so a redeploy does not need an empty commit to trigger it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy'
        type: choice
        options: [production, preview]
        default: production

# Two deploys of the same project at once would race to be the live one.
concurrency:
  group: deploy-vercel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fail here with something readable rather than ten lines into the CLI
      # with "Error: No existing credentials found".
      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "${{ secrets.VERCEL_TOKEN }}" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "${{ secrets.VERCEL_ORG_ID }}" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # Pinned to a major rather than @latest: a CLI that changes under us is
      # not something to discover during a deploy.
      - run: npm install --global vercel@50

      - name: Decide the target
        id: target
        run: |
          if [ "${{ inputs.environment }}" = "preview" ]; then
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          fi

      # Brings down the project's environment variables, so the build sees the
      # same TURSO_*, AWS_* and ALLOWED_IPS values the dashboard holds.
      - name: Pull the project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          set -o pipefail
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy — ${{ steps.target.outputs.env }}"
            echo ""
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              echo "${{ steps.deploy.outputs.url }}"
            else
              echo "The deploy did not complete. See the step log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
